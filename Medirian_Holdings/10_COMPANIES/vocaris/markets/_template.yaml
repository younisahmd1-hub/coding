# Copy this file to <city>.yaml to grow a new market cell. Files starting with "_" are ignored.
id: city_id
name: City Name
country: XX
status: planned
timezone: Etc/UTC
currency: USD
languages: [en]
dialect: null
phone_country_code: "+0"
districts: []
segments:
  barber: {query: "barber shop", weight: 1.0}
scoring:
  min_rating: 4.0
  busy_review_count: 150
  prefer_website: true
  booking_platforms_bonus: [fresha, booksy]
demo_link_template: "https://vocaris.ai/demo/{slug}"
require_verified_demo: true
offer: {trial: "30 days free, no card"}
telephony: {path: undecided, notes: ""}
channels:
  email: {enabled: true, cold_allowed: false, daily_cap: 20}     # check local B2B email law first
  whatsapp: {enabled: true, cold_allowed: false, daily_cap: 100}
  call_list: {enabled: true, cold_allowed: false, daily_cap: 30, call_hours: [10, 18]}
  ads: {enabled: false, platforms: [], daily_budget_usd: 0}
targets: {}
